[project]
name = "pintake"
version = "0.1.0"
description = "Resumable ~/Downloads -> Paperless-ngx intake with local-model classification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
]

[project.scripts]
pintake = "pintake.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pintake"]
